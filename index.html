<style>
  /*
   * Cambridge 5054 Electricity Lab
   * Hand-adapted single-file build. Colours and spacing are pulled
   * straight from the original design tokens so nothing looks or
   * behaves differently — only the delivery mechanism changed.
   */
  :root {
    --background: 216 32% 8%;
    --foreground: 48 22% 92%;
    --border: 214 20% 20%;
    --input: 214 20% 24%;
    --card: 216 27% 12%;
    --card-foreground: 48 22% 92%;
    --primary: 42 96% 61%;
    --primary-foreground: 216 32% 8%;
    --secondary: 211 30% 17%;
    --secondary-foreground: 48 22% 92%;
    --muted: 215 19% 16%;
    --muted-foreground: 215 12% 62%;
    --accent: 174 71% 47%;
    --accent-foreground: 216 32% 8%;
    --destructive: 4 77% 61%;
    --destructive-foreground: 48 22% 92%;
    --ring: 42 96% 61%;
    --app-font-sans: "Avenir Next", "Trebuchet MS", sans-serif;
    --app-font-mono: "SFMono-Regular", Consolas, monospace;
    --radius: 0.7rem;
  }

  * { box-sizing: border-box; }
  html, body, #root { min-height: 100%; }
  body {
    margin: 0;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: var(--app-font-sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; }
  button { cursor: pointer; }

  /* ---------- shell layout ---------- */
  .lab-app {
    min-height: 100dvh;
    background:
      radial-gradient(circle at 80% -10%, rgba(241, 188, 60, .07), transparent 34rem),
      radial-gradient(circle at -10% 80%, rgba(49, 207, 190, .04), transparent 30rem),
      hsl(var(--background));
  }
  .app-shell { display: flex; min-height: 100dvh; }
  .sidebar {
    position: sticky; top: 0; height: 100dvh; width: 224px; flex: 0 0 224px;
    border-right: 1px solid hsl(var(--border)); background: rgba(12, 20, 31, .88);
    padding: 22px 14px; display: flex; flex-direction: column; z-index: 5;
  }
  .brand { padding: 0 11px 24px; border-bottom: 1px solid hsl(var(--border)); }
  .brand-mark { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.04em; font-size: 16px; }
  .mark-icon { width: 27px; height: 27px; border: 1px solid hsl(var(--primary)); color: hsl(var(--primary)); display: grid; place-items: center; border-radius: 7px; position: relative; }
  .mark-icon::before, .mark-icon::after { content: ""; position: absolute; width: 5px; height: 1px; background: currentColor; left: -4px; }
  .mark-icon::before { top: 8px; box-shadow: 30px 0 currentColor; }
  .mark-icon::after { top: 16px; box-shadow: 30px 0 currentColor; }
  .brand small { color: hsl(var(--muted-foreground)); display: block; margin: 9px 0 0 37px; font: 10px var(--app-font-mono); letter-spacing: .11em; text-transform: uppercase; }
  .nav-label { color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); letter-spacing: .12em; text-transform: uppercase; padding: 22px 11px 8px; }
  .nav-button { width: 100%; display: flex; align-items: center; gap: 11px; color: hsl(var(--muted-foreground)); background: transparent; border: 0; border-radius: 8px; padding: 11px; text-align: left; font-size: 13px; transition: background .2s, color .2s, transform .2s; }
  .nav-button:hover { background: rgba(255,255,255,.04); color: hsl(var(--foreground)); transform: translateX(2px); }
  .nav-button.active { color: hsl(var(--primary)); background: rgba(240, 188, 60, .11); }
  .nav-button .nav-count { margin-left: auto; font: 10px var(--app-font-mono); color: hsl(var(--muted-foreground)); }
  .sidebar-foot { margin-top: auto; border-top: 1px solid hsl(var(--border)); padding: 16px 11px 0; color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.5; }
  .sidebar-foot strong { display: block; color: hsl(var(--foreground)); font-size: 12px; margin-bottom: 3px; }
  .main-area { flex: 1; min-width: 0; }
  .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; border-bottom: 1px solid hsl(var(--border)); background: rgba(11,18,28,.58); backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 4; }
  .crumb { display: flex; align-items: center; gap: 10px; color: hsl(var(--muted-foreground)); font-size: 12px; }
  .crumb strong { color: hsl(var(--foreground)); font-weight: 600; }
  .top-actions { display: flex; gap: 10px; align-items: center; }
  .icon-button, .outline-button { border: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); background: rgba(255,255,255,.02); border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; transition: border .2s, color .2s, background .2s, transform .2s; }
  .icon-button { height: 34px; width: 34px; }
  .outline-button { gap: 8px; padding: 9px 12px; font-size: 12px; }
  .icon-button:hover, .outline-button:hover { border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: rgba(240,188,60,.08); transform: translateY(-1px); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #203c4b; color: hsl(var(--accent)); display: grid; place-items: center; font: 11px var(--app-font-mono); border: 1px solid #2d6d6d; }
  .page { padding: 30px; max-width: 1560px; margin: 0 auto; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
  .eyebrow { color: hsl(var(--primary)); text-transform: uppercase; letter-spacing: .16em; font: 10px var(--app-font-mono); }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(27px, 3vw, 38px); letter-spacing: -.055em; line-height: 1.05; margin-top: 8px; }
  h2 { font-size: 17px; letter-spacing: -.03em; }
  h3 { font-size: 13px; }
  .heading-copy { color: hsl(var(--muted-foreground)); margin-top: 9px; font-size: 13px; max-width: 560px; line-height: 1.5; }
  .mode-switch { display: flex; gap: 3px; padding: 4px; border: 1px solid hsl(var(--border)); background: rgba(7,12,19,.5); border-radius: 9px; }
  .mode-switch button { border: 0; background: transparent; color: hsl(var(--muted-foreground)); padding: 9px 13px; border-radius: 6px; font-size: 12px; }
  .mode-switch button.active { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-weight: 700; }

  /* ---------- experiment / bench ---------- */
  .icon-drawn { font-size: 17px; font-weight: 800; line-height: 1; color: hsl(var(--primary)); }
  .syllabus-link { font-size: 11px; padding: 8px 11px; }
  .syllabus-index { color: hsl(var(--primary)); font: 9px var(--app-font-mono); min-width: 18px; }
  .lab-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid hsl(var(--border)); background: rgba(15, 27, 38, .7); border-radius: 9px; }
  .starter-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .toolbar-label { color: hsl(var(--muted-foreground)); font: 9px var(--app-font-mono); letter-spacing: .12em; text-transform: uppercase; }
  .starter-row button { border: 1px solid rgba(126, 160, 169, .22); color: hsl(var(--muted-foreground)); border-radius: 5px; padding: 6px 8px; font-size: 10px; background: rgba(255,255,255,.02); transition: .2s; }
  .starter-row button:hover { border-color: hsl(var(--primary)); color: hsl(var(--primary)); background: rgba(240,188,60,.07); }
  .symbol-toggle { position: relative; display: flex; align-items: center; gap: 8px; color: hsl(var(--muted-foreground)); font-size: 10px; white-space: nowrap; cursor: pointer; }
  .symbol-toggle input { position: absolute; opacity: 0; }
  .toggle-track { width: 32px; height: 17px; border-radius: 10px; background: #253944; border: 1px solid #4e6872; position: relative; transition: .2s; }
  .toggle-track::after { content: ""; position: absolute; width: 11px; height: 11px; top: 2px; left: 2px; border-radius: 50%; background: #7e9499; transition: .2s; }
  .symbol-toggle input:checked + .toggle-track { background: rgba(49,207,190,.2); border-color: hsl(var(--accent)); }
  .symbol-toggle input:checked + .toggle-track::after { transform: translateX(15px); background: hsl(var(--accent)); }
  .stage-badge { position: absolute; top: 13px; left: 16px; z-index: 2; color: hsl(var(--primary)); font: 9px var(--app-font-mono); letter-spacing: .1em; }
  .stage-badge span { color: hsl(var(--muted-foreground)); letter-spacing: 0; }
  .topology-svg { width: 100%; height: 350px; margin-top: 28px; overflow: visible; }
  .svg-component { cursor: pointer; transition: filter .2s; }
  .svg-component:hover { filter: drop-shadow(0 0 7px rgba(241,188,60,.4)); }
  .stage-readout { position: absolute; bottom: 40px; left: 22px; right: 22px; display: flex; justify-content: space-between; color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); }
  .stage-readout .live-dot { display: inline-block; margin-right: 5px; }
  .stage-switch { position: absolute; right: 20px; bottom: 38px; padding: 6px 9px; border: 1px solid rgba(49,207,190,.35); border-radius: 5px; color: hsl(var(--accent)); background: rgba(49,207,190,.06); font: 10px var(--app-font-mono); }
  .stage-switch.off { color: hsl(var(--destructive)); border-color: rgba(226,101,83,.35); background: rgba(226,101,83,.06); }
  .selected-apparatus { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(129,163,169,.15); padding-bottom: 13px; margin-bottom: 14px; }
  .selected-apparatus strong, .selected-apparatus span { display: block; }
  .selected-apparatus strong { font-size: 12px; }
  .selected-apparatus span { color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); margin-top: 3px; }
  .inspector-empty { min-height: 170px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: hsl(var(--muted-foreground)); text-align: center; }
  .inspector-empty svg { color: hsl(var(--primary)); opacity: .75; }
  .inspector-empty strong { color: hsl(var(--foreground)); font-size: 12px; }
  .inspector-empty span { max-width: 180px; font-size: 10px; line-height: 1.5; }
  .on-action { color: hsl(var(--accent)); border-color: rgba(49,207,190,.5); background: rgba(49,207,190,.08); }
  .health-note, .fault-panel { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(129,163,169,.15); font: 10px var(--app-font-mono); color: hsl(var(--muted-foreground)); }
  .health-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: hsl(var(--accent)); box-shadow: 0 0 8px hsl(var(--accent)); }
  .fault { display: flex; gap: 7px; align-items: flex-start; padding: 8px 0; line-height: 1.45; }
  .fault svg { flex: 0 0 auto; margin-top: 1px; }
  .fault-error { color: hsl(var(--destructive)); }
  .fault-warning { color: hsl(var(--primary)); }
  .experiment-console { margin-top: 12px; padding: 18px; }
  .console-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding-bottom: 15px; border-bottom: 1px solid rgba(129,163,169,.15); }
  .console-head h2 { margin-top: 5px; }
  .console-head p { max-width: 560px; color: hsl(var(--muted-foreground)); font-size: 11px; line-height: 1.5; margin-top: 5px; }
  .console-head select, .prediction-bar select, .numeric-answer input { border: 1px solid hsl(var(--border)); background: #101c28; color: hsl(var(--foreground)); border-radius: 5px; padding: 8px 10px; font-size: 11px; }
  .prediction-bar { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(129,163,169,.15); }
  .prediction-bar > div { display: flex; flex-direction: column; gap: 5px; margin-right: auto; }
  .prediction-bar strong { font-size: 12px; }
  .prediction-bar select { min-width: 210px; }
  .prediction-bar .secondary-button:disabled { opacity: .35; }
  .console-actions { display: flex; align-items: center; gap: 9px; padding: 14px 0 6px; }
  .console-actions > span { margin-left: auto; color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); }
  .graph-wrap { margin-top: 8px; padding: 9px 0 0; border-top: 1px solid rgba(129,163,169,.12); }
  .graph-title { display: flex; justify-content: space-between; color: hsl(var(--muted-foreground)); font-size: 10px; }
  .graph-title .mono { font: 9px var(--app-font-mono); }
  .graph-wrap svg { width: 100%; max-height: 170px; }
  .data-table-wrap { overflow-x: auto; border: 1px solid rgba(129,163,169,.13); border-radius: 6px; }
  .data-table-wrap .data-table { min-width: 420px; }
  .evidence-note { display: flex; gap: 7px; align-items: center; color: hsl(var(--accent)); font-size: 10px; margin-top: 12px; }
  .divider-console { display: grid; grid-template-columns: repeat(3, minmax(110px, 1fr)) minmax(180px, 1.4fr); gap: 16px; align-items: center; padding: 18px 0 5px; }
  .divider-console .range-wrap { padding: 0; }
  .divider-result { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid rgba(241,188,60,.32); border-radius: 7px; background: rgba(240,188,60,.06); }
  .divider-result span, .divider-result small { color: hsl(var(--muted-foreground)); font-size: 10px; }
  .divider-result strong { color: hsl(var(--primary)); font: 22px var(--app-font-mono); }

  /* ---------- learn ---------- */
  .learn-space { display: flex; flex-direction: column; gap: 12px; }
  .concept-tabs { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .concept-tabs button { min-height: 58px; padding: 8px; border: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); background: rgba(255,255,255,.02); border-radius: 7px; text-align: left; font-size: 10px; transition: .2s; }
  .concept-tabs button span { display: block; color: hsl(var(--primary)); font: 9px var(--app-font-mono); margin-bottom: 6px; }
  .concept-tabs button:hover, .concept-tabs button.selected { border-color: hsl(var(--primary)); color: hsl(var(--foreground)); background: rgba(240,188,60,.08); }
  .learning-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 23px; min-height: 142px; }
  .learning-hero h2 { font-size: 26px; margin-top: 8px; letter-spacing: -.05em; }
  .learning-hero p { max-width: 650px; color: hsl(var(--muted-foreground)); font-size: 12px; line-height: 1.55; margin-top: 8px; }
  .formula-stamp { padding: 12px 14px; border: 1px solid rgba(241,188,60,.35); color: hsl(var(--primary)); background: rgba(240,188,60,.07); border-radius: 7px; font: 13px var(--app-font-mono); white-space: nowrap; }
  .learning-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 12px; }
  .demo-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }
  .calculation { display: flex; flex-direction: column; gap: 7px; padding: 13px; margin-top: 18px; border-left: 2px solid hsl(var(--primary)); background: rgba(240,188,60,.055); }
  .calculation span { color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); }
  .calculation strong { color: hsl(var(--primary)); font: 15px var(--app-font-mono); }
  .flow-toggle { display: flex; gap: 6px; margin-top: 17px; }
  .flow-toggle button { padding: 7px 9px; border: 1px solid hsl(var(--border)); border-radius: 5px; color: hsl(var(--muted-foreground)); font-size: 10px; }
  .flow-toggle button.active { color: hsl(var(--accent)); border-color: hsl(var(--accent)); background: rgba(49,207,190,.08); }
  .charge-rail { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: hsl(var(--muted-foreground)); font: 10px var(--app-font-mono); }
  .charge-pulses { position: relative; display: flex; justify-content: space-around; align-items: center; height: 22px; flex: 1; border-top: 1px solid #43626b; border-bottom: 1px solid #43626b; overflow: hidden; }
  .charge-pulses i { width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--primary)); animation: charge-travel 1.2s linear infinite; }
  .charge-rail.electrons .charge-pulses i { background: hsl(var(--accent)); animation-name: charge-travel-reverse; }
  .caption { color: hsl(var(--muted-foreground)); font-size: 10px; line-height: 1.5; margin-top: 16px; }
  .term-list { margin-top: 14px; }
  .term-list > div { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(129,163,169,.13); }
  .term-list strong { font-size: 11px; }
  .term-list span { color: hsl(var(--muted-foreground)); font-size: 10px; text-align: right; }
  .equation-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
  .equation-pair > div { padding: 11px; border: 1px solid rgba(129,163,169,.18); border-radius: 6px; }
  .equation-pair b, .equation-pair span { display: block; }
  .equation-pair b { color: hsl(var(--primary)); font: 14px var(--app-font-mono); }
  .equation-pair span { color: hsl(var(--muted-foreground)); font-size: 10px; line-height: 1.4; margin-top: 4px; }
  .concept-callout { display: flex; gap: 8px; align-items: center; padding: 12px; margin-top: 22px; color: hsl(var(--accent)); border: 1px solid rgba(49,207,190,.25); border-radius: 6px; font-size: 10px; }
  .primary-button { border: 0; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); border-radius: 6px; padding: 9px 13px; font-size: 11px; font-weight: 700; transition: transform .2s, filter .2s; display: inline-flex; align-items: center; gap: 7px; }
  .primary-button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .primary-button:disabled { opacity: .4; cursor: not-allowed; }
  .secondary-button { border: 1px solid hsl(var(--border)); background: transparent; color: hsl(var(--foreground)); border-radius: 6px; padding: 8px 12px; font-size: 11px; display: inline-flex; align-items: center; gap: 7px; }
  .secondary-button:hover { border-color: hsl(var(--accent)); color: hsl(var(--accent)); }
  .lesson-card { padding: 22px; min-height: 255px; }
  .lesson-card p { color: hsl(var(--muted-foreground)); font-size: 12px; line-height: 1.65; margin-top: 9px; max-width: 600px; }

  /* ---------- exam ---------- */
  .numeric-answer { display: flex; gap: 8px; align-items: center; }
  .numeric-answer input { font: 16px var(--app-font-mono); width: 160px; }
  .numeric-answer span { color: hsl(var(--muted-foreground)); font: 13px var(--app-font-mono); }
  .mark-feedback { display: flex; flex-direction: column; gap: 7px; padding: 13px; margin-top: 16px; border-radius: 6px; font-size: 11px; line-height: 1.5; }
  .mark-feedback.correct { color: hsl(var(--accent)); border: 1px solid rgba(49,207,190,.3); background: rgba(49,207,190,.06); }
  .mark-feedback.incorrect { color: hsl(var(--destructive)); border: 1px solid rgba(226,101,83,.3); background: rgba(226,101,83,.06); }
  .question-actions { display: flex; justify-content: flex-end; margin-top: 22px; }
  .progress-line { height: 4px; margin-top: 9px; border-radius: 3px; background: #263947; overflow: hidden; }
  .progress-line > div { height: 100%; border-radius: inherit; background: hsl(var(--accent)); transition: width .3s; }
  .exam-side { display: flex; flex-direction: column; padding: 17px; }
  .exam-side h3 { margin-bottom: 14px; }
  .exam-side .secondary-button { width: 100%; margin-top: auto; }
  .exam-note { display: flex; gap: 7px; padding: 14px 0; margin-top: 20px; border-top: 1px solid hsl(var(--border)); color: hsl(var(--muted-foreground)); font-size: 10px; line-height: 1.5; }
  .exam-note svg { color: hsl(var(--primary)); flex: 0 0 auto; }
  .exam-layout { display: grid; grid-template-columns: minmax(0, 1.2fr) 320px; gap: 12px; }
  .question-card { padding: 21px; }
  .question-meta { display: flex; justify-content: space-between; align-items: center; font: 10px var(--app-font-mono); color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: .1em; }
  .question-card h2 { font-size: 21px; margin: 28px 0 22px; line-height: 1.35; max-width: 680px; }
  .answer-list { display: grid; gap: 8px; }
  .answer-option { display: flex; gap: 11px; align-items: center; border: 1px solid hsl(var(--border)); background: rgba(255,255,255,.015); color: hsl(var(--foreground)); border-radius: 7px; padding: 13px; text-align: left; font-size: 12px; transition: border .2s, background .2s; }
  .answer-option:hover { border-color: hsl(var(--accent)); }
  .answer-option.selected { border-color: hsl(var(--primary)); background: rgba(240,188,60,.1); }
  .answer-key { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid hsl(var(--border)); border-radius: 5px; color: hsl(var(--muted-foreground)); font: 11px var(--app-font-mono); }
  .selected .answer-key { color: hsl(var(--primary)); border-color: hsl(var(--primary)); }
  .question-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }

/* ---------------------------------------------------------------------
 * Circuit model: components, wires and the small helpers that build them
 * ------------------------------------------------------------------- */

let componentSeed = 20;

function makeComponent(kind, label, value) {
  const meta = componentMeta[kind];
  return {
    id: kind + '-' + (componentSeed++),
    kind: kind,
    label: label || meta.label,
    value: value === undefined ? meta.value : value,
    terminals: ['a', 'b'],
    closed: (kind === 'switch' || kind === 'push') ? true : undefined,
    temperature: kind === 'thermistor' ? 20 : undefined,
    light: kind === 'ldr' ? 50 : undefined,
  };
}

function connect(id, a, other, b) {
  return { id: 'wire-' + id + '-' + other, from: { componentId: id, terminal: a }, to: { componentId: other, terminal: b } };
}

function starterCircuit(kind) {
  const source = makeComponent('battery', '6 V battery', 6);
  const sw = makeComponent('switch', 'S1');
  const r1 = makeComponent('resistor', 'R1 \u00B7 10 \u03A9', 10);
  const r2 = makeComponent(kind === 'sensor' ? 'ldr' : 'resistor', kind === 'sensor' ? 'LDR \u00B7 1 k\u03A9' : 'R2 \u00B7 10 \u03A9', kind === 'sensor' ? 1000 : 10);
  const variable = makeComponent('variable', 'Variable resistor', 20);
  const am = makeComponent('ammeter', 'A1');
  const vm = makeComponent('voltmeter', 'V1');

  const components =
    kind === 'series' ? [source, sw, r1, r2] :
    kind === 'parallel' ? [source, sw, r1, r2] :
    kind === 'ohm' ? [source, sw, am, r1, variable, vm] :
    kind === 'sensor' ? [source, sw, r2, r1, vm] :
    [source, sw, r1, r2, vm];

  let wires = [];
  if (kind === 'parallel') {
    wires = [
      connect(source.id, 'a', sw.id, 'a'),
      connect(sw.id, 'b', r1.id, 'a'),
      connect(sw.id, 'b', r2.id, 'a'),
      connect(r1.id, 'b', source.id, 'b'),
      connect(r2.id, 'b', source.id, 'b'),
    ];
  } else if (kind === 'ohm') {
    wires = [
      connect(source.id, 'a', sw.id, 'a'),
      connect(sw.id, 'b', am.id, 'a'),
      connect(am.id, 'b', r1.id, 'a'),
      connect(r1.id, 'b', variable.id, 'a'),
      connect(variable.id, 'b', source.id, 'b'),
      connect(vm.id, 'a', r1.id, 'a'),
      connect(vm.id, 'b', r1.id, 'b'),
    ];
  } else if (kind === 'sensor') {
    wires = [
      connect(source.id, 'a', sw.id, 'a'),
      connect(sw.id, 'b', r2.id, 'a'),
      connect(r2.id, 'b', r1.id, 'a'),
      connect(r1.id, 'b', source.id, 'b'),
      connect(vm.id, 'a', r1.id, 'a'),
      connect(vm.id, 'b', r1.id, 'b'),
    ];
  } else {
    wires = [
      connect(source.id, 'a', sw.id, 'a'),
      connect(sw.id, 'b', r1.id, 'a'),
      connect(r1.id, 'b', r2.id, 'a'),
      connect(r2.id, 'b', source.id, 'b'),
    ];
    if (kind === 'divider') wires.push(connect(vm.id, 'a', r2.id, 'a'), connect(vm.id, 'b', r2.id, 'b'));
  }
  return { components: components, wires: wires };
}

const initialOhmCircuit = starterCircuit('ohm');

/* ---------------------------------------------------------------------
 * Component electrical models
 * ------------------------------------------------------------------- */

function componentResistance(c, voltage) {
  const v = Math.abs(voltage);
  if (c.kind === 'switch' || c.kind === 'push') return c.closed ? 0.05 : 1e9;
  if (c.kind === 'ammeter') return 0.01;
  if (c.kind === 'voltmeter') return 1e6;
  if (c.kind === 'fuse') return c.blown ? 1e9 : 0.05;
  if (c.kind === 'lamp') return Math.max(1.2, 3.1 + 3.4 * Math.pow(Math.min(5, v), 0.68));
  if (c.kind === 'diode' || c.kind === 'led') {
    const threshold = c.kind === 'led' ? 1.8 : 0.55;
    if (voltage <= threshold) return 1e6;
    const diodeI = Math.max(0.001, 0.002 * Math.exp(Math.min(8, (v - threshold) / 0.08)));
    return Math.max(5, v / diodeI);
  }
  if (c.kind === 'thermistor') return Math.max(20, c.value * Math.exp(-0.035 * ((c.temperature === undefined ? 20 : c.temperature) - 20)));
  if (c.kind === 'ldr') return Math.max(50, c.value * (1.1 - 0.009 * (c.light === undefined ? 50 : c.light)));
  if (c.kind === 'generator') return 0.5;
  return Math.max(0.1, c.value);
}

/* Gaussian elimination with partial pivoting, used by the nodal solver below. */
function gaussianSolve(matrix, rhs) {
  const n = rhs.length;
  for (let i = 0; i < n; i++) {
    let pivot = i;
    for (let r = i + 1; r < n; r++) {
      if (Math.abs(matrix[r][i]) > Math.abs(matrix[pivot][i])) pivot = r;
    }
    if (Math.abs(matrix[pivot][i]) < 1e-10) continue;
    const tmpRow = matrix[i]; matrix[i] = matrix[pivot]; matrix[pivot] = tmpRow;
    const tmpRhs = rhs[i]; rhs[i] = rhs[pivot]; rhs[pivot] = tmpRhs;
    for (let r = i + 1; r < n; r++) {
      const factor = matrix[r][i] / matrix[i][i];
      for (let c = i; c < n; c++) matrix[r][c] -= factor * matrix[i][c];
      rhs[r] -= factor * rhs[i];
    }
  }
  const result = Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let sum = rhs[i];
    for (let c = i + 1; c < n; c++) sum -= matrix[i][c] * result[c];
    result[i] = Math.abs(matrix[i][i]) < 1e-10 ? 0 : sum / matrix[i][i];
  }
  return result.map(v => Number.isFinite(v) ? v : 0);
}

/* Full nodal (KCL) solver: unions terminals that share a wire into nodes,
 * then iterates a few times so voltage-dependent components (lamps,
 * diodes, thermistors, LDRs) settle on a consistent operating point. */
function solveCircuit(components, wires) {
  const byId = new Map(components.map(c => [c.id, c]));
  const parent = {};
  const key = (id, t) => id + ':' + t;
  const find = (x) => {
    if (parent[x] === undefined) parent[x] = x;
    if (parent[x] !== x) parent[x] = find(parent[x]);
    return parent[x];
  };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[rb] = ra; };

  components.forEach(c => c.terminals.forEach(t => { parent[key(c.id, t)] = key(c.id, t); }));
  wires.forEach(w => union(key(w.from.componentId, w.from.terminal), key(w.to.componentId, w.to.terminal)));

  const source = components.find(c => ['cell', 'battery', 'powerSupply', 'generator'].includes(c.kind));
  const faults = [];
  const warnings = [];
  const byComponent = {};

  if (!source) {
    return { sourceVoltage: 0, totalCurrent: 0, equivalentResistance: 0, active: false, nodes: {}, byComponent: byComponent, faults: ['Add a cell, battery or power supply to energise the circuit.'], warnings: warnings };
  }

  const pos = find(key(source.id, 'a'));
  const neg = find(key(source.id, 'b'));
  const nodeRoots = Array.from(new Set(Object.keys(parent).map(find)));
  if (pos === neg) faults.push('Short circuit: the source terminals are connected to the same node.');

  const unconnected = components.filter(c => !wires.some(w => w.from.componentId === c.id || w.to.componentId === c.id));
  if (unconnected.length) warnings.push('Unconnected terminal: ' + unconnected.map(c => c.label).join(', ') + '.');

  const voltage = Math.max(0, source.value);
  const unknownRoots = nodeRoots.filter(r => r !== pos && r !== neg);
  const values = {};
  values[pos] = voltage;
  values[neg] = 0;

  for (let iteration = 0; iteration < 8; iteration++) {
    const index = new Map(unknownRoots.map((r, i) => [r, i]));
    const matrix = unknownRoots.map(() => Array(unknownRoots.length).fill(0));
    const rhs = unknownRoots.map(() => 0);

    components.filter(c => c.id !== source.id).forEach(c => {
      const a = find(key(c.id, 'a'));
      const b = find(key(c.id, 'b'));
      const previousV = (values[a] || 0) - (values[b] || 0);
      const resistance = componentResistance(c, previousV);
      const g = 1 / Math.max(1e-7, resistance);
      if (a !== pos && a !== neg && index.has(a)) {
        const i = index.get(a);
        matrix[i][i] += g;
        if (b === pos) rhs[i] += g * voltage;
        else if (b !== neg && index.has(b)) matrix[i][index.get(b)] -= g;
      }
      if (b !== pos && b !== neg && index.has(b)) {
        const i = index.get(b);
        matrix[i][i] += g;
        if (a === pos) rhs[i] += g * voltage;
        else if (a !== neg && index.has(a)) matrix[i][index.get(a)] -= g;
      }
    });

    const solved = gaussianSolve(matrix, rhs);
    unknownRoots.forEach((r, i) => { values[r] = solved[i]; });
  }

  components.filter(c => c.id !== source.id).forEach(c => {
    const a = find(key(c.id, 'a'));
    const b = find(key(c.id, 'b'));
    const v = (values[a] || 0) - (values[b] || 0);
    const r = componentResistance(c, v);
    const current = Math.abs(v / Math.max(1e-7, r));
    byComponent[c.id] = { voltage: Math.abs(v), current: current, resistance: r >= 1e8 ? Infinity : r, power: Math.abs(v * current) };
    if (c.kind === 'fuse' && current > c.value) faults.push('Fuse operated: ' + c.label + ' exceeded its ' + c.value.toFixed(1) + ' A rating.');
    if (['diode', 'led'].includes(c.kind) && v < 0 && current > 0.00001) warnings.push(c.label + ' is reverse-biased; reverse current is negligible.');
  });

  const outgoing = components.filter(c => c.id !== source.id).filter(c => find(key(c.id, 'a')) === pos);
  const totalCurrent = outgoing.reduce((sum, c) => sum + ((byComponent[c.id] && byComponent[c.id].current) || 0), 0);
  const equivalentResistance = totalCurrent > 1e-8 ? voltage / totalCurrent : 0;
  const active = voltage > 0 && totalCurrent > 1e-6 && !faults.some(f => f.includes('Short') || f.includes('Fuse'));

  const meters = components.filter(c => c.kind === 'ammeter' || c.kind === 'voltmeter');
  meters.forEach(meter => {
    const m = byComponent[meter.id];
    const a = find(key(meter.id, 'a'));
    const b = find(key(meter.id, 'b'));
    const across = components.some(c => c.id !== meter.id && c.kind !== 'voltmeter' && find(key(c.id, 'a')) === a && find(key(c.id, 'b')) === b);
    if (meter.kind === 'ammeter' && across) faults.push('Incorrect connection: an ammeter should be connected in series with the circuit section being measured.');
    if (meter.kind === 'voltmeter' && !across) faults.push('Incorrect connection: a voltmeter should be connected in parallel across the component being measured.');
    if (m) {
      if (meter.kind === 'ammeter') byComponent[meter.id] = Object.assign({}, m, { current: across ? 0 : totalCurrent });
      else byComponent[meter.id] = Object.assign({}, m, { voltage: across ? Math.abs((values[a] || 0) - (values[b] || 0)) : 0, current: 0, resistance: Infinity, power: 0 });
    }
  });

  return { sourceVoltage: voltage, totalCurrent: totalCurrent, equivalentResistance: equivalentResistance, active: active, nodes: values, byComponent: byComponent, faults: faults, warnings: warnings };
}

function format(value, digits) {
  if (digits === undefined) digits = 2;
  return Number.isFinite(value) ? value.toFixed(digits) : '\u2014';
}
function unitValue(value, unit, digits) {
  return format(value, digits) + ' ' + unit;
}

/* ---------------------------------------------------------------------
 * Application state
 * ------------------------------------------------------------------- */

function routeModeFromPath(pathname) {
  if (pathname === '/learn') return 'learn';
  if (pathname === '/exam') return 'exam';
  if (pathname === '/build') return 'build';
  return 'experiment';
}

const state = {
  mode: routeModeFromPath(window.location.pathname),
  section: 'quantities',
  experiment: 'ohms-law',
  ivComponent: 'resistor',
  components: initialOhmCircuit.components.map(c => Object.assign({}, c, { terminals: c.terminals.slice() })),
  wires: initialOhmCircuit.wires.slice(),
  selectedId: initialOhmCircuit.components[3] ? initialOhmCircuit.components[3].id : undefined,
  freeComponents: [],
  freeWires: [],
  freeSelectedId: undefined,
  symbolMode: true,
  notice: 'Circuit model ready \u00B7 measurements derive from topology',
  readings: [],
  prediction: '',
  predictionRevealed: false,
  qCharge: 20,
  qTime: 4,
  flowMode: 'conventional',
  workEnergy: 12,
  workCharge: 3,
  dividerSupply: 6,
  dividerR1: 10,
  dividerR2: 20,
  wireLength: 1,
  wireArea: 1,
  examIndex: 0,
  examAnswer: '',
  examSubmitted: false,
  answered: [],
  showMobileNav: false,
  draggingFreeId: undefined,
  pendingTerminal: undefined,
};

function announce(message) { state.notice = message; }

function currentForExperiment(voltage, kind) {
  const component = {
    id: 'iv-test-model',
    kind: kind,
    label: 'I\u2013V test model',
    value: kind === 'lamp' ? 6 : kind === 'diode' ? 0.7 : 10,
    terminals: ['a', 'b'],
  };
  const resistance = componentResistance(component, voltage);
  return voltage / Math.max(0.001, resistance);
}

function wireCurrent(length, area, voltage) {
  return voltage / Math.max(0.01, 0.017 * length / Math.max(0.05, area));
}

/* ---------------------------------------------------------------------
 * Actions (all mutate `state`, then re-render)
 * ------------------------------------------------------------------- */

function changeMode(next) {
  state.mode = next;
  const path = next === 'experiment' ? '/' : '/' + next;
  window.history.pushState({}, '', path);
  announce(
    next === 'learn' ? 'Core concept notes ready' :
    next === 'exam' ? 'Cambridge-style practice desk ready' :
    next === 'build' ? 'Free-build schematic ready' :
    'Workbench ready'
  );
  render();
}

function loadCircuit(kind) {
  const next = starterCircuit(kind);
  state.components = next.components;
  state.wires = next.wires;
  const r = next.components.find(c => c.kind === 'resistor');
  state.selectedId = r ? r.id : undefined;
  state.mode = 'experiment';
  window.history.pushState({}, '', '/');
  announce((kind === 'ohm' ? 'Ohm\u2019s law' : kind[0].toUpperCase() + kind.slice(1)) + ' starter loaded');
  render();
}

function updateComponent(id, patch) {
  state.components = state.components.map(c => c.id === id ? Object.assign({}, c, patch) : c);
}

function addComponent(kind) {
  const next = makeComponent(kind);
  const previousComponents = state.components;
  state.components = previousComponents.concat([next]);
  if (previousComponents.length) {
    const last = previousComponents[previousComponents.length - 1];
    state.wires = state.wires.concat([connect(next.id, 'a', last.id, 'b')]);
  }
  state.selectedId = next.id;
  announce(next.label + ' added \u00B7 connect its terminals to complete the loop');
  render();
}

function resetBench() {
  loadCircuit('ohm');
  state.readings = [];
  state.prediction = '';
  state.predictionRevealed = false;
  render();
}

function addFreeComponent(kind) {
  const next = makeComponent(kind);
  const n = state.freeComponents.length;
  next.position = { x: 150 + (n % 4) * 220, y: 125 + Math.floor(n / 4) * 155 };
  state.freeComponents = state.freeComponents.concat([next]);
  state.freeSelectedId = next.id;
  announce(next.label + ' added \u00B7 drag it and click two terminals to wire');
  render();
}

function updateFreeComponent(id, patch) {
  state.freeComponents = state.freeComponents.map(c => c.id === id ? Object.assign({}, c, patch) : c);
}

function removeFreeComponent(id) {
  state.freeComponents = state.freeComponents.filter(c => c.id !== id);
  state.freeWires = state.freeWires.filter(w => w.from.componentId !== id && w.to.componentId !== id);
  if (state.freeSelectedId === id) state.freeSelectedId = undefined;
  announce('Component removed from the free-build schematic');
  render();
}

function clearFreeBuild() {
  state.freeComponents = [];
  state.freeWires = [];
  state.freeSelectedId = undefined;
  announce('Free-build canvas cleared');
  render();
}

function removeFreeWire(id) {
  state.freeWires = state.freeWires.filter(w => w.id !== id);
  announce('Wire removed from the schematic');
  render();
}

function recordReading() {
  const solver = solveCircuit(state.components, state.wires);
  const x = state.experiment === 'wire' ? state.wireLength : solver.sourceVoltage;
  const y =
    state.experiment === 'wire' ? wireCurrent(state.wireLength, state.wireArea, solver.sourceVoltage) :
    state.experiment === 'iv' ? currentForExperiment(solver.sourceVoltage, state.ivComponent) :
    solver.totalCurrent;
  state.readings = state.readings.concat([{ x: x, y: y, r: y > 0 ? x / y : 0 }]);
  announce('Reading recorded \u00B7 ' + format(x, 2) + ' ' + (state.experiment === 'wire' ? 'm' : 'V') + ' / ' + format(y, 3) + ' A');
  render();
}

function submitExam() {
  state.examSubmitted = true;
  if (state.answered.indexOf(state.examIndex) === -1) state.answered = state.answered.concat([state.examIndex]);
  render();
}
function nextExam() {
  state.examIndex = (state.examIndex + 1) % examQuestions.length;
  state.examAnswer = '';
  state.examSubmitted = false;
  render();
}
function goToExam(i) {
  state.examIndex = i;
  state.examAnswer = '';
  state.examSubmitted = false;
  render();
}
function setExamAnswer(v) {
  state.examAnswer = v;
  state.examSubmitted = false;
  render();
}

function iconHTML(name, size, extraClass) {
  size = size || 16;
  if (name === 'flask-drawn') return '<span class="icon-drawn" aria-hidden="true">\u2341</span>';

  return '<i data-lucide="' + name + '" style="width:' + size + 'px;height:' + size + 'px" class="' + (extraClass || '') + '"></i>';
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

 * free-build canvas)

function symbolShapeSVG(kind, stroke, accent, closed) {

  }
  if (kind === 'resistor' || kind === 'variable' || kind === 'thermistor' || kind === 'ldr' || kind === 'fuse' || kind === 'heater') {
    let extra = '';
    if (kind === 'variable') extra = '<line x1="-25" y1="22" x2="24" y2="-22" stroke="' + accent + '" stroke-width="2"/><path d="M24 -22 l-8 2 l4 7" fill="none" stroke="' + accent + '" stroke-width="2"/>';
    if (kind === 'thermistor') extra = '<line x1="-24" y1="20" x2="23" y2="-20" stroke="' + accent + '" stroke-width="2"/>';
    if (kind === 'ldr') extra = '<path d="M-42 -30 l10 10 M-34 -34 l2 12" stroke="' + accent + '" stroke-width="2"/><path d="M42 -30 l-10 10 M34 -34 l-2 12" stroke="' + accent + '" stroke-width="2"/>';
    if (kind === 'fuse') extra = '<line x1="-30" y1="0" x2="30" y2="0" stroke="' + accent + '" stroke-width="2"/>';
    if (kind === 'heater') extra = '<path d="M-22 0 q8 -16 16 0 t16 0 t16 0" fill="none" stroke="' + accent + '" stroke-width="2"/>';
    return '<rect x="-30" y="-12" width="60" height="24" fill="none" stroke="' + stroke + '" stroke-width="2"/>' + extra;
  }
  if (kind === 'lamp' || kind === 'motor' || kind === 'buzzer' || kind === 'relay' || kind === 'generator') {
    let extra = '';
    if (kind === 'lamp') extra = '<line x1="-13" y1="-13" x2="13" y2="13" stroke="' + accent + '" stroke-width="2"/><line x1="-13" y1="13" x2="13" y2="-13" stroke="' + accent + '" stroke-width="2"/>';
    if (kind === 'motor') extra = '<text text-anchor="middle" y="7" fill="' + accent + '" font-size="16" font-weight="700">M</text>';
    if (kind === 'buzzer') extra = '<text text-anchor="middle" y="5" fill="' + accent + '" font-size="9" font-weight="700">BZ</text>';
    if (kind === 'relay') extra = '<text text-anchor="middle" y="6" fill="' + accent + '" font-size="15" font-weight="700">K</text>';
    if (kind === 'generator') extra = '<text text-anchor="middle" y="7" fill="' + accent + '" font-size="15" font-weight="700">G</text>';
    return '<circle r="22" fill="none" stroke="' + stroke + '" stroke-width="2"/>' + extra;
  }
  if (kind === 'diode' || kind === 'led') {
    let extra = '';
    if (kind === 'led') extra = '<path d="M24 -20 l10 -10 M31 -18 l4 -2" stroke="' + accent + '" stroke-width="2"/><path d="M33 -8 l10 -10 M40 -6 l4 -2" stroke="' + accent + '" stroke-width="2"/>';
    return '<path d="M-18 -16 L18 0 L-18 16 Z" fill="none" stroke="' + stroke + '" stroke-width="2"/><line x1="18" y1="-18" x2="18" y2="18" stroke="' + stroke + '" stroke-width="2"/>' + extra;
  }
  if (kind === 'switch' || kind === 'push') {
    return '<circle cx="-28" cy="0" r="4" fill="' + (closed ? accent : 'none') + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<circle cx="28" cy="0" r="4" fill="' + (closed ? accent : 'none') + '" stroke="' + stroke + '" stroke-width="2"/>' +
      '<line x1="-24" y1="0" x2="' + (closed ? 24 : 13) + '" y2="' + (closed ? 0 : -16) + '" stroke="' + stroke + '" stroke-width="2"/>';
  }
  if (kind === 'ammeter' || kind === 'voltmeter') {
    return '<circle r="22" fill="none" stroke="' + stroke + '" stroke-width="2"/><text text-anchor="middle" y="7" fill="' + accent + '" font-size="17" font-weight="700">' + (kind === 'ammeter' ? 'A' : 'V') + '</text>';
  }
  if (kind === 'coil') {
    return '<path d="M-30 0 c5 -22 11 -22 16 0 s11 22 16 0 s11 -22 16 0 s11 22 16 0" fill="none" stroke="' + stroke + '" stroke-width="2"/>';
  }
  if (kind === 'transformer') {
    return '<path d="M-25 -24 c-18 6 -18 18 0 24 s18 18 0 24" fill="none" stroke="' + stroke + '" stroke-width="2"/>' +
      '<path d="M25 -24 c18 6 18 18 0 24 s-18 18 0 24" fill="none" stroke="' + stroke + '" stroke-width="2"/>' +
      '<line x1="0" y1="-28" x2="0" y2="28" stroke="' + accent + '" stroke-width="2"/>';
  }
  return '<rect x="-26" y="-15" width="52" height="30" fill="none" stroke="' + stroke + '" stroke-width="2"/>';
}

/* opts: { kind, x, y, label, value, selected, closed, showTerminals, compact,
 *         onClickAttr, onPointerDownAttr, onTerminalAAttr, onTerminalBAttr } */
function standardSymbolSVG(opts) {
  const stroke = opts.selected ? 'hsl(var(--primary))' : 'hsl(var(--foreground))';
  const accent = 'hsl(var(--primary))';
  const textSize = opts.compact ? 9 : 10;
  const closed = opts.closed === undefined ? true : opts.closed;
  const showTerminals = opts.showTerminals === undefined ? true : opts.showTerminals;
  const shape = symbolShapeSVG(opts.kind, stroke, accent, closed);
  const meta = componentMeta[opts.kind] || { label: opts.kind };

  let html = '<g transform="translate(' + opts.x + ',' + opts.y + ')" class="svg-component standard-symbol ' + (opts.selected ? 'selected' : '') + '"';
  if (opts.onClickAttr) html += ' onclick="' + opts.onClickAttr + '"';
  if (opts.onPointerDownAttr) html += ' onpointerdown="' + opts.onPointerDownAttr + '"';
  html += ' role="button" aria-label="' + escapeHTML(opts.label) + ', ' + escapeHTML(meta.label) + '">';
  html += '<line x1="-74" y1="0" x2="-30" y2="0" stroke="' + stroke + '" stroke-width="2"/><line x1="30" y1="0" x2="74" y2="0" stroke="' + stroke + '" stroke-width="2"/>';
  // FIX: Add onpointerdown="event.stopPropagation();" to both terminal circles
  html += '<circle cx="-74" cy="0" r="6" fill="' + (opts.selected ? accent : '#10202a') + '" stroke="' + accent + '" stroke-width="1.5" onpointerdown="event.stopPropagation();"' + (opts.onTerminalAAttr ? ' onclick="event.stopPropagation();' + opts.onTerminalAAttr + '"' : '') + '/>';
  html += '<circle cx="74" cy="0" r="6" fill="' + (opts.selected ? accent : '#10202a') + '" stroke="' + accent + '" stroke-width="1.5" onpointerdown="event.stopPropagation();"' + (opts.onTerminalBAttr ? ' onclick="event.stopPropagation();' + opts.onTerminalBAttr + '"' : '') + '/>';
  html += shape;
  if (showTerminals) html += '<text x="-74" y="17" fill="hsl(var(--muted-foreground))" font-size="8">A</text><text x="68" y="17" fill="hsl(var(--muted-foreground))" font-size="8">B</text>';
  html += '<text x="0" y="45" text-anchor="middle" fill="' + (opts.selected ? accent : 'hsl(var(--foreground))') + '" font-size="' + textSize + '" font-weight="700">' + escapeHTML(opts.label) + '</text>';
  if (opts.value) html += '<text x="0" y="58" text-anchor="middle" fill="hsl(var(--muted-foreground))" font-size="8">' + escapeHTML(opts.value) + '</text>';
  html += '</g>';
  return html;
}

function miniSymbolSVG(kind) {
  return '<svg viewBox="0 0 70 30" aria-hidden="true"><line x1="2" y1="15" x2="18" y2="15" stroke="currentColor" stroke-width="1.5"/><line x1="52" y1="15" x2="68" y2="15" stroke="currentColor" stroke-width="1.5"/><g transform="translate(35 15)">' +
    standardSymbolSVG({ kind: kind, x: 0, y: 0, label: '', value: '', compact: true }) + '</g></svg>';
}

/* ---------------------------------------------------------------------
 * Small shared pieces: range editor, fault panel, graph
 * ------------------------------------------------------------------- */

function rangeEditorHTML(id, label, value, min, max, step, unit, onInputAttr) {
  step = step === undefined ? 1 : step;
  const displayDigits = step < 1 ? 1 : 0;
  return '<div class="range-wrap">' +
    '<div class="range-label"><span>' + escapeHTML(label) + '</span><strong>' + format(value, displayDigits) + ' ' + unit + '</strong></div>' +
    '<input id="' + id + '" type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '" oninput="' + onInputAttr + '"/>' +
    '</div>';
}

function faultPanelHTML(solver) {
  if (!solver.faults.length && !solver.warnings.length) {
    return '<div class="health-note"><span class="health-dot"></span> Circuit checks passed \u00B7 KCL-compatible topology</div>';
  }
  let html = '<div class="fault-panel">';
  solver.faults.forEach(fault => { html += '<div class="fault fault-error">' + iconHTML('info', 13) + '<span>' + escapeHTML(fault) + '</span></div>'; });
  solver.warnings.forEach(warning => { html += '<div class="fault fault-warning">' + iconHTML('circle-help', 13) + '<span>' + escapeHTML(warning) + '</span></div>'; });
  html += '</div>';
  return html;
}

function graphSVG(points, experiment) {
  const maxY = Math.max(0.1, ...points.map(p => Math.abs(p.y)));
  const minX = Math.min(-1, ...points.map(p => p.x));
  const maxX = Math.max(1, ...points.map(p => p.x));
  const pointString = points.map(p => (32 + ((p.x - minX) / (maxX - minX)) * 320) + ',' + (132 - (p.y / maxY) * 100)).join(' ');
  let html = '<div class="graph-wrap"><div class="graph-title"><span>I\u2013V / measured data</span><span class="mono">y: current (A) \u00B7 x: ' + (experiment === 'iv' ? 'p.d. (V)' : 'voltage (V)') + '</span></div>';
  html += '<svg viewBox="0 0 390 160" role="img" aria-label="Measured data graph">';
  html += '<path d="M32 15 V132 H365" stroke="#4a6470"/><path d="M32 32 H365 M32 82 H365" stroke="#2a414d" stroke-dasharray="3 5"/>';
  html += '<polyline points="' + pointString + '" fill="none" stroke="hsl(var(--accent))" stroke-width="2"/>';
  points.forEach(p => {
    const cx = 32 + ((p.x - minX) / (maxX - minX)) * 320;
    const cy = 132 - (p.y / maxY) * 100;
    html += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="hsl(var(--primary))"/>';
  });
  html += '<text x="8" y="18" fill="#8397a0" font-size="9">I</text><text x="356" y="149" fill="#8397a0" font-size="9">V</text>';
  html += '</svg></div>';
  return html;
}

/* ---------------------------------------------------------------------
 * Circuit workbench sketch (used by the Experiment view)
 * ------------------------------------------------------------------- */

function circuitSketchHTML(components, wires, solver, selectedId, symbolMode) {
  const visible = components.filter(c => c.kind !== 'voltmeter');
  const slots = Math.max(1, visible.length);
  let html = '<div class="circuit-stage ' + (symbolMode ? 'symbol-stage' : '') + '">';
  html += '<div class="stage-badge">IEC CIRCUIT SYMBOLS <span>\u00B7 ' + wires.length + ' terminal connections</span></div>';
  html += '<svg class="topology-svg" viewBox="0 0 900 350" role="img" aria-label="Circuit topology diagram">';
  html += '<path d="M120 80 H780 V275 H120 Z" fill="none" stroke="' + (solver.active ? 'hsl(var(--accent))' : '#526d78') + '" stroke-width="3" stroke-dasharray="' + (solver.active ? '0' : '7 8') + '"/>';
  visible.forEach((c, i) => {
    const x = 115 + (i / Math.max(1, slots - 1)) * 650;
    const onBottom = i % 2 === 1;
    const y = onBottom ? 275 : 80;
    const measurement = solver.byComponent[c.id];
    const value = measurement ? format(measurement.current, 2) + ' A' : componentMeta[c.kind].detail;
    html += standardSymbolSVG({
      kind: c.kind, x: x, y: y, label: c.label, value: value,
      selected: selectedId === c.id, closed: c.closed, showTerminals: symbolMode,
      onClickAttr: "selectComponent('" + c.id + "')",
    });
  });
  html += '<text x="120" y="48" fill="hsl(var(--muted-foreground))" font-size="10">source +</text><text x="120" y="315" fill="hsl(var(--muted-foreground))" font-size="10">return / source \u2212</text>';
  html += '</svg>';
  html += '<div class="stage-readout"><span>' + (solver.active ? '<span class="live-dot"></span> current flowing' : 'bench standby') + '</span><span>' + (solver.faults.length ? 'fault detected' : Object.keys(solver.nodes).length + ' nodes \u00B7 ' + wires.length + ' wires') + '</span></div>';
  components.filter(c => c.kind === 'switch').forEach(c => {
    html += '<button class="stage-switch ' + (c.closed ? '' : 'off') + '" onclick="toggleSwitch(\'' + c.id + '\')">' + iconHTML('power', 14) + ' ' + escapeHTML(c.label) + ': ' + (c.closed ? 'closed' : 'open') + '</button>';
  });
  html += '</div>';
  return html;
}

function toggleSwitch(id) {
  const c = state.components.find(item => item.id === id);
  updateComponent(id, { closed: !(c && c.closed) });
  render();
}

/* ---------------------------------------------------------------------
 * Experiment view
 * ------------------------------------------------------------------- */

const experimentCatalog = ['battery', 'switch', 'resistor', 'lamp', 'ammeter', 'voltmeter', 'variable', 'diode', 'thermistor', 'ldr', 'motor', 'fuse'];
const expTitles = { 'ohms-law': 'Ohm\u2019s law', iv: 'I\u2013V characteristics', wire: 'Resistance of a wire', series: 'Series circuit', parallel: 'Parallel circuit', divider: 'Potential divider' };

function experimentViewHTML() {
  const solver = solveCircuit(state.components, state.wires);
  const selected = state.components.find(c => c.id === state.selectedId);
  const sm = selected ? solver.byComponent[selected.id] : undefined;
  const dividerOutput = state.dividerSupply * state.dividerR2 / Math.max(0.1, state.dividerR1 + state.dividerR2);
  const ivPoints = state.readings.length ? state.readings : Array.from({ length: 7 }, (_, i) => {
    const v = (i - 3) * 1;

    return { x: v, y: currentForExperiment(v, kind), r: 0 };
  });

  let html = '<div class="lab-toolbar"><div class="starter-row"><span class="toolbar-label">STARTER CIRCUITS</span>' +
    '<button onclick="loadCircuit(\'ohm\')">Ohm\u2019s law</button>' +
    '<button onclick="loadCircuit(\'series\')">Series</button>' +
    '<button onclick="loadCircuit(\'parallel\')">Parallel</button>' +
    '<button onclick="loadCircuit(\'divider\')">Divider</button>' +
    '<button onclick="loadCircuit(\'sensor\')">LDR sensor</button></div>' +
    '<label class="symbol-toggle"><span>' + (state.symbolMode ? 'Circuit symbols' : 'Realistic apparatus') + '</span>' +
    '<input type="checkbox" ' + (state.symbolMode ? 'checked' : '') + ' onchange="setSymbolMode(this.checked)"/><span class="toggle-track"></span></label></div>';

  html += '<div class="bench-grid">';

  // component library
  html += '<section class="panel component-panel" aria-label="Component library"><div class="panel-head"><div class="panel-title">' + iconHTML('sliders-horizontal', 15) + ' Component library</div><span class="panel-note">' + state.components.length + ' on bench</span></div><div class="component-list">';
  experimentCatalog.forEach(kind => {
    const meta = componentMeta[kind];
    html += '<div class="component-card"><div class="component-symbol">' + iconHTML(meta.icon, 16) + '</div><div><strong>' + meta.label + '</strong><span>' + meta.detail + '</span></div>' +
      '<button class="add-component" onclick="addComponent(\'' + kind + '\')" aria-label="Add ' + meta.label + '">' + iconHTML('plus', 15) + '</button></div>';
  });
  html += '<button class="tiny-action" onclick="announceAndRender(\'Select a component on the bench to edit its value and inspect its live state\')">' + iconHTML('circle-help', 13) + ' How to build a circuit</button>';
  html += '</div></section>';

  // bench
  html += '<section class="panel bench" aria-label="Circuit workbench"><div class="bench-head"><div><div class="panel-title">' + iconHTML('cable', 15) + ' Circuit workbench</div><div class="status"><span class="live-dot"></span> ' + (solver.active ? 'Live circuit' : 'Circuit paused') + '</div></div>' +
    '<div class="bench-tools"><button onclick="resetBench()">' + iconHTML('rotate-ccw', 12) + ' Reset</button><button onclick="announceAndRender(\'The diagram is generated from actual terminal connections\')">Topology</button></div></div>';
  html += circuitSketchHTML(state.components, state.wires, solver, selected ? selected.id : undefined, state.symbolMode);
  html += '<div class="bench-caption"><span>Click an apparatus to inspect it</span><span>' + (solver.faults.length ? 'Needs correction' : 'Topology solved') + '</span></div></section>';

  // inspector
  html += '<section class="panel inspector-panel" aria-label="Live inspector"><div class="panel-head"><div class="panel-title">' + iconHTML('activity', 15) + ' Live inspector</div><span class="panel-note">topology-derived</span></div><div class="inspector-body">';
  if (selected) {
    html += '<div class="selected-apparatus"><div class="component-symbol">' + iconHTML(componentMeta[selected.kind].icon, 16) + '</div><div><strong>' + escapeHTML(selected.label) + '</strong><span>' + componentMeta[selected.kind].detail + '</span></div></div>';
    html += '<div class="readout-grid"><div class="readout"><div class="readout-label">Potential diff.</div><div class="readout-value">' + unitValue(sm ? sm.voltage : 0, 'V', 2) + '</div></div><div class="readout"><div class="readout-label">Current</div><div class="readout-value">' + unitValue(sm ? sm.current : 0, 'A', 3) + '</div></div></div>';
    html += '<div class="meter-row"><span>Resistance</span><strong>' + unitValue(sm ? sm.resistance : 0, '\u03A9', 2) + '</strong></div>';
    html += '<div class="meter-row"><span>Power</span><strong>' + unitValue(sm ? sm.power : 0, 'W', 2) + '</strong></div>';
    if (selected.kind === 'thermistor') html += rangeEditorHTML('bench-temp', 'Temperature', selected.temperature === undefined ? 20 : selected.temperature, 0, 100, 1, '\u00B0C', "updateSelectedComponent('temperature', Number(this.value))");
    if (selected.kind === 'ldr') html += rangeEditorHTML('bench-light', 'Light intensity', selected.light === undefined ? 50 : selected.light, 0, 100, 1, '%', "updateSelectedComponent('light', Number(this.value))");
    if (!['switch', 'push', 'ammeter', 'voltmeter'].includes(selected.kind)) {
      const isSource = ['battery', 'cell', 'powerSupply'].includes(selected.kind);
      html += rangeEditorHTML('bench-value', 'Component value', selected.value, 1, isSource ? 12 : 200, 1, isSource ? 'V' : '\u03A9', "updateSelectedComponent('value', Number(this.value))");
    }
    if (selected.kind === 'switch' || selected.kind === 'push') {
      html += '<button class="tiny-action ' + (selected.closed ? 'on-action' : '') + '" onclick="updateSelectedComponent(\'closed\', ' + (!selected.closed) + ')">' + iconHTML('power', 13) + ' Contact: ' + (selected.closed ? 'closed' : 'open') + '</button>';
    }
  } else {
    html += '<div class="inspector-empty">' + iconHTML('settings-2', 24) + '<strong>Select an apparatus</strong><span>Live current, p.d., resistance and power will appear here.</span></div>';
  }
  html += faultPanelHTML(solver);
  html += '</div></section>';

  html += '</div>'; // bench-grid

  html += '<section class="panel experiment-console"><div class="console-head"><div><div class="eyebrow">Virtual practical</div><h2>' + expTitles[state.experiment] + '</h2><p>' +

     state.experiment === 'iv' ? 'Measure how current responds to positive and negative p.d. for different components.' :

    '<option value="iv"' + (state.experiment === 'iv' ? ' selected' : '') + '>I\u2013V characteristics</option>' +

    '<option value="parallel"' + (state.experiment === 'parallel' ? ' selected' : '') + '>Parallel circuits</option>' +
    '<option value="divider"' + (state.experiment === 'divider' ? ' selected' : '') + '>Potential divider</option>' +
    '</select></div>';

  if (state.experiment === 'divider') {
    html += '<div class="divider-console">' +
      rangeEditorHTML('divider-supply', 'Supply', state.dividerSupply, 1, 12, 1, 'V', "setStateNumber('dividerSupply', Number(this.value))") +
      rangeEditorHTML('divider-r1', 'R1', state.dividerR1, 1, 100, 1, '\u03A9', "setStateNumber('dividerR1', Number(this.value))") +
      rangeEditorHTML('divider-r2', 'R2', state.dividerR2, 1, 100, 1, '\u03A9', "setStateNumber('dividerR2', Number(this.value))") +

      '</div>';
  } else if (state.experiment === 'wire') {
    html += '<div class="divider-console">' +
      rangeEditorHTML('wire-length', 'Length', state.wireLength, 0.2, 5, 0.2, 'm', "setStateNumber('wireLength', Number(this.value))") +
      rangeEditorHTML('wire-area', 'Area', state.wireArea, 0.2, 3, 0.2, 'mm\u00B2', "setStateNumber('wireArea', Number(this.value))") +
      '<div class="divider-result"><span>Calculated resistance</span><strong>' + (0.017 * state.wireLength / state.wireArea).toFixed(3) + ' \u03A9</strong><small>R = \u03C1L \u00F7 A \u00B7 same material</small></div>' +
      '</div>';
  } else {
    html += '<div class="prediction-bar"><div><span class="toolbar-label">PREDICT FIRST</span><strong>' + (state.experiment === 'iv' ? 'What will the I\u2013V curve look like?' : 'What will happen to current?') + '</strong></div>';
    if (state.experiment === 'iv') {
      html += '<select onchange="setIvComponent(this.value)">' +
        '<option value="resistor"' + (state.ivComponent === 'resistor' ? ' selected' : '') + '>Fixed resistor</option>' +
        '<option value="lamp"' + (state.ivComponent === 'lamp' ? ' selected' : '') + '>Filament lamp</option>' +
        '<option value="diode"' + (state.ivComponent === 'diode' ? ' selected' : '') + '>Diode</option>' +
        '</select>';
    }
    html += '<select ' + (state.predictionRevealed ? 'disabled' : '') + ' onchange="setPrediction(this.value)">' +
      '<option value="">Choose a prediction\u2026</option>' +
      '<option value="linear"' + (state.prediction === 'linear' ? ' selected' : '') + '>A straight line through the origin</option>' +
      '<option value="curve"' + (state.prediction === 'curve' ? ' selected' : '') + '>A curve because resistance changes</option>' +
      '<option value="small"' + (state.prediction === 'small' ? ' selected' : '') + '>Very small / negligible current</option>' +
      '<option value="decrease"' + (state.prediction === 'decrease' ? ' selected' : '') + '>Current decreases as resistance increases</option>' +
      '</select>';
    html += '<button class="secondary-button" ' + (!state.prediction ? 'disabled' : '') + ' onclick="revealPrediction()">Reveal evidence</button></div>';
    html += '<div class="console-actions"><button class="primary-button" onclick="recordReading()">' + iconHTML('plus', 13) + ' Record solver reading</button>' +
      '<button class="secondary-button" onclick="clearReadings()">' + iconHTML('trash-2', 13) + ' Clear data</button>' +
      '<span>' + state.readings.length + ' readings \u00B7 ' + (solver.active ? format(solver.totalCurrent, 3) + ' A live' : 'close the switch to measure') + '</span></div>';
    html += graphSVG(ivPoints, state.experiment);
    html += '<div class="data-table-wrap"><table class="data-table"><thead><tr><th>' + (state.experiment === 'iv' ? 'P.d. / V' : 'V / V') + '</th><th>Current / A</th><th>R = V/I / \u03A9</th></tr></thead><tbody>';
    if (state.readings.length) {
      state.readings.forEach(row => { html += '<tr><td>' + row.x.toFixed(2) + '</td><td>' + row.y.toFixed(3) + '</td><td>' + row.r.toFixed(2) + '</td></tr>'; });
    } else {
      html += '<tr><td colspan="3">No readings yet \u2014 make a prediction, then record data.</td></tr>';
    }
    html += '</tbody></table></div>';
    if (state.predictionRevealed) html += '<div class="evidence-note">' + iconHTML('check', 14) + ' Evidence is calculated from the selected component model and the measured points, not drawn as a decorative curve.</div>';
  }
  html += '</section>';

  return html;
}

function updateSelectedComponent(key, value) {
  if (!state.selectedId) return;
  const patch = {};
  patch[key] = value;
  updateComponent(state.selectedId, patch);
  render();
}
function setSymbolMode(checked) { state.symbolMode = checked; render(); }
function setExperimentType(value) { state.experiment = value; state.readings = []; state.prediction = ''; state.predictionRevealed = false; render(); }
function setIvComponent(value) { state.ivComponent = value; state.readings = []; render(); }
function setPrediction(value) { state.prediction = value; render(); }
function revealPrediction() { state.predictionRevealed = true; render(); }
function clearReadings() { state.readings = []; render(); }
function setStateNumber(key, value) { state[key] = value; render(); }
function announceAndRender(message) { announce(message); render(); }
function selectComponent(id) { state.selectedId = id; render(); }

/* ---------------------------------------------------------------------
 * Free build view
 * ------------------------------------------------------------------- */

function componentPosition(component, fallbackIndex) {
  fallbackIndex = fallbackIndex || 0;
  return component.position || { x: 150 + (fallbackIndex % 4) * 220, y: 125 + Math.floor(fallbackIndex / 4) * 155 };
}
function terminalPosition(component, terminal) {
  const position = componentPosition(component);
  return { x: position.x + (terminal === 'a' ? -74 : 74), y: position.y };
}

const freeCatalog = Object.keys(componentMeta);

function freeBuildViewHTML() {
  const solver = solveCircuit(state.freeComponents, state.freeWires);
  const selected = state.freeComponents.find(c => c.id === state.freeSelectedId);
  const source = state.freeComponents.find(c => ['cell', 'battery', 'powerSupply', 'generator'].includes(c.kind));
  const graphPoints = !source
    ? [{ x: 0, y: 0 }, { x: 1, y: 0 }]
    : Array.from({ length: 7 }, (_, index) => {
        const voltage = source.value * index / 6;
        const sample = state.freeComponents.map(c => c.id === source.id ? Object.assign({}, c, { value: voltage }) : c);
        return { x: voltage, y: solveCircuit(sample, state.freeWires).totalCurrent };
      });

  let html = '<div class="free-build">';
  html += '<div class="free-build-toolbar panel"><div><div class="eyebrow">Open schematic bench</div><h2>Free build mode</h2><p>Place any components, drag them into position, and connect terminals A \u2192 B. Every wire changes the live solver.</p></div>';

      '<circle data-wire-a="' + wire.id + '" cx="' + a.x + '" cy="' + a.y + '" r="4"/><circle data-wire-b="' + wire.id + '" cx="' + b.x + '" cy="' + b.y + '" r="4"/></g>';

    html += '<button class="danger-button" onclick="removeFreeComponent(\'' + selected.id + '\')">' + iconHTML('trash-2', 13) + ' Remove component</button></div>';

  }

    (solver.active ? 'The solver is sweeping the source voltage across your current topology.' : 'Add a source and complete a closed path to populate the solver and graph.') + '</p></div>' +
    '<div class="free-metrics"><div><span>Source</span><strong>' + unitValue(solver.sourceVoltage, 'V', 2) + '</strong></div><div><span>Total current</span><strong>' + unitValue(solver.totalCurrent, 'A', 3) + '</strong></div><div><span>Equivalent R</span><strong>' + unitValue(solver.equivalentResistance, '\u03A9', 2) + '</strong></div></div></div>';
  html += graphSVG(graphPoints, 'ohms-law');
  html += '</section>';

  html += '</div>'; // free-build
  return html;
}

function selectFreeComponent(id) { state.freeSelectedId = id; render(); }
function updateFreeComponentField(key, value) {
  if (!state.freeSelectedId) return;
  const patch = {};
  patch[key] = value;
  updateFreeComponent(state.freeSelectedId, patch);
  render();
}
function cancelPendingTerminal() { state.pendingTerminal = undefined; render(); }

function startFreeDrag(event, id) {
  if (event.button !== 0) return;
  state.freeSelectedId = id;
  state.draggingFreeId = id;
  render();
}
function moveFreeComponent(event) {
  if (!state.draggingFreeId) return;
  const svg = document.getElementById('free-canvas');
  if (!svg) return;
  const bounds = svg.getBoundingClientRect();
  const x = Math.max(90, Math.min(910, ((event.clientX - bounds.left) / bounds.width) * 1000));
  const y = Math.max(70, Math.min(500, ((event.clientY - bounds.top) / bounds.height) * 560));
  const id = state.draggingFreeId;
  state.freeComponents = state.freeComponents.map(c => c.id === id ? Object.assign({}, c, { position: { x: x, y: y } }) : c);

  const g = svg.querySelector('[data-free-comp="' + id + '"]');
  if (g) g.setAttribute('transform', 'translate(' + x + ',' + y + ')');
  state.freeWires.forEach(wire => {
    if (wire.from.componentId !== id && wire.to.componentId !== id) return;
    const from = state.freeComponents.find(c => c.id === wire.from.componentId);
    const to = state.freeComponents.find(c => c.id === wire.to.componentId);
    if (!from || !to) return;
    const a = terminalPosition(from, wire.from.terminal);
    const b = terminalPosition(to, wire.to.terminal);
    const midX = a.x + (b.x - a.x) / 2;
    const path = svg.querySelector('[data-wire-path="' + wire.id + '"]');
    const ca = svg.querySelector('[data-wire-a="' + wire.id + '"]');
    const cb = svg.querySelector('[data-wire-b="' + wire.id + '"]');
    if (path) path.setAttribute('d', 'M ' + a.x + ' ' + a.y + ' L ' + midX + ' ' + a.y + ' L ' + midX + ' ' + b.y + ' L ' + b.x + ' ' + b.y);
    if (ca) { ca.setAttribute('cx', a.x); ca.setAttribute('cy', a.y); }
    if (cb) { cb.setAttribute('cx', b.x); cb.setAttribute('cy', b.y); }
  });
}
function finishFreeDrag() {
  if (!state.draggingFreeId) return;
  state.draggingFreeId = undefined;
  render();
}

function selectFreeTerminal(componentId, terminal) {
  if (!state.pendingTerminal) {
    state.pendingTerminal = { componentId: componentId, terminal: terminal };
    state.freeSelectedId = componentId;
    announce('Terminal selected \u00B7 click a second terminal to draw a wire');
    render();
    return;
  }
  if (state.pendingTerminal.componentId === componentId && state.pendingTerminal.terminal === terminal) {
    state.pendingTerminal = undefined;
    render();
    return;
  }
  const pending = state.pendingTerminal;
  const duplicate = state.freeWires.some(wire =>
    (wire.from.componentId === pending.componentId && wire.from.terminal === pending.terminal && wire.to.componentId === componentId && wire.to.terminal === terminal) ||
    (wire.to.componentId === pending.componentId && wire.to.terminal === pending.terminal && wire.from.componentId === componentId && wire.from.terminal === terminal));
  if (!duplicate) {
    const wire = { id: 'free-wire-' + Date.now() + '-' + state.freeWires.length, from: pending, to: { componentId: componentId, terminal: terminal } };
    state.freeWires = state.freeWires.concat([wire]);
    announce('Wire added \u00B7 topology recalculated');
  } else {
    announce('Those terminals are already connected');
  }
  state.pendingTerminal = undefined;
  render();
}

    html += '<div class="demo-controls">' +

  html += '<div class="nav-label">Workbench</div>';
  html += '<button class="nav-button" onclick="changeMode(\'experiment\')">' + iconHTML('git-branch', 16) + '<span>Starter circuits</span></button>';
  html += '<button class="nav-button" onclick="announceAndRender(\'Notebook data is kept in this browser session\')">' + iconHTML('book-open', 16) + '<span>My notebook</span></button>';
  html += '<div class="sidebar-foot"><strong>CAMBRIDGE O LEVEL</strong>5054 \u00B7 Electricity &amp; magnetism<br/><span style="color:hsl(var(--accent))">\u25CF</span> Local session saved</div>';
  html += '</aside>';

  // main area
  html += '<main class="main-area"><header class="topbar">';
  html += '<div class="crumb"><button class="icon-button" onclick="toggleMobileNav()" data-testid="button-mobile-menu" aria-label="Toggle navigation">' + iconHTML('menu', 16) + '</button><span>Cambridge 5054</span>' + iconHTML('chevron-right', 13) + '<strong>' + crumbLabel() + '</strong></div>';
  html += '<div class="top-actions"><button class="outline-button" onclick="announceAndRender(\'All work is saved locally\')">' + iconHTML('check', 14) + ' Saved just now</button>' +
    '<button class="icon-button" onclick="announceAndRender(\'Use the syllabus map to move between concepts\')" aria-label="Lab settings">' + iconHTML('settings-2', 16) + '</button><div class="avatar">AM</div></div>';
  html += '</header>';

  if (state.showMobileNav) {
    html += '<nav class="mobile-nav">';
    navItems.forEach(item => {
      html += '<button class="nav-button ' + (state.mode === item.id ? 'active' : '') + '" onclick="changeModeAndCloseMobile(\'' + item.id + '\')">' + iconHTML(item.icon, 16) + item.label + '</button>';
    });
    html += '</nav>';
  }

  html += '<div class="page"><div class="page-heading"><div><div class="eyebrow">Cambridge O Level Physics 5054 \u00B7 Electricity</div><h1>' + pageTitle() + '</h1><p class="heading-copy">' + pageCopy() + '</p></div>';
  html += '<div class="mode-switch" role="tablist">';
  navItems.forEach(item => { html += '<button class="' + (state.mode === item.id ? 'active' : '') + '" onclick="changeMode(\'' + item.id + '\')">' + item.label + '</button>'; });
  html += '</div></div>';

  if (state.mode === 'experiment') html += experimentViewHTML();
  else if (state.mode === 'build') html += freeBuildViewHTML();
  else if (state.mode === 'learn') html += learnViewHTML();
  else if (state.mode === 'exam') html += examViewHTML();

  html += '</div></main></div>';

  if (state.notice) {
    html += '<div class="toast-note" data-testid="status-toast">' + iconHTML('info', 14, '') + ' ' + escapeHTML(state.notice) + '</div>';
  }
  html += '</div>';

  document.getElementById('root').innerHTML = html;
  if (window.lucide) lucide.createIcons();
}

function toggleMobileNav() { state.showMobileNav = !state.showMobileNav; render(); }
function changeModeAndCloseMobile(id) { state.mode = id; state.showMobileNav = false; changeMode(id); }
function goToSyllabus(id) { state.section = id; changeMode('learn'); }

window.addEventListener('popstate', () => { state.mode = routeModeFromPath(window.location.pathname); render(); });

/* ---------------------------------------------------------------------
 * Boot
 * ------------------------------------------------------------------- */

render();
</script>
</body>
  </html>
